<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2927">
  <meta name="description" content="A conversation with ReliefRN, your AI disaster-assistance navigator.">
  <title>ReliefRN · Messages</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="desktop-brand" aria-hidden="true"><span class="brand-mark">r.</span><span>ReliefRN</span></div>
  <main class="phone" aria-label="Messages with ReliefRN">
    <div class="status-bar" aria-hidden="true">
      <span id="clock">9:41</span><span class="island"></span>
      <div class="status-icons"><svg viewBox="0 0 20 16"><path d="M2 12v3m5-7v7m5-11v11m5-15v15" stroke="currentColor" stroke-width="3"/></svg><svg viewBox="0 0 20 16"><path d="M1 5a14 14 0 0 1 18 0M4 8a9 9 0 0 1 12 0M7 11a4 4 0 0 1 6 0" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="14" r="1.4"/></svg><svg viewBox="0 0 27 15"><rect x="1" y="1" width="22" height="13" rx="4" fill="none" stroke="currentColor"/><rect x="3" y="3" width="18" height="9" rx="2"/><path d="M25 5v5" stroke="currentColor" stroke-width="2"/></svg></div>
    </div>
    <header class="contact-header">
      <span class="header-spacer" aria-hidden="true"></span>
      <div class="contact"><span class="avatar" aria-hidden="true">r<span>.</span></span><h1>ReliefRN</h1><p>Disaster assistance</p></div>
      <button class="restart-button" id="new-chat" type="button" aria-label="Restart demo" title="Restart with a fresh conversation"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6"/></svg><span>Restart</span></button>
    </header>
    <section class="thread" id="thread" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
      <div class="date-label" id="date-label">Today</div>
      <div id="messages"></div>
      <div class="typing-row" id="typing" hidden aria-label="ReliefRN is replying"><div class="typing"><i></i><i></i><i></i></div><span id="typing-label">ReliefRN is replying</span></div>
    </section>
    <footer class="composer-area">
      <div id="actions" class="actions" hidden></div>
      <div id="error" class="error" role="alert" hidden></div>
      <form id="composer" class="composer">
        <label for="message" class="sr-only">Message ReliefRN</label>
        <textarea id="message" name="message" rows="1" maxlength="4000" placeholder="Text message" autocomplete="off" enterkeyhint="send" required disabled></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      <p class="demo-note" id="demo-note">Demo · No real texts or callbacks are sent.</p>
      <span class="home-indicator" aria-hidden="true"></span>
    </footer>
  </main>
  <div class="desktop-caption" aria-hidden="true"><span>ReliefRN / Interactive demo</span></div>
</body>
</html>
