<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A conversation with ReliefRN, your AI disaster-assistance navigator.">
  <title>ReliefRN · Messages</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="device-stage">
  <main class="phone" aria-label="Messages with ReliefRN">
    <div class="status-bar">
      <span id="clock" aria-hidden="true">9:41</span><span class="island" aria-hidden="true"></span>
      <div class="status-icons" role="img" aria-label="Simulated low cellular signal: one bar, LTE" title="Simulated low signal">
        <svg class="cellular" viewBox="0 0 20 16" aria-hidden="true"><rect x="0" y="11" width="3.5" height="5" rx=".8" fill="currentColor"/><path d="M5.5 7.5h3.5V16H5.5zM11 4h3.5v12H11zM16.5 0H20v16h-3.5z" fill="#c7c7cc"/></svg>
        <span class="network" aria-hidden="true">LTE</span>
        <svg class="battery" viewBox="0 0 28 15" aria-hidden="true"><rect x=".75" y=".75" width="23" height="13.5" rx="4" fill="none" stroke="currentColor" opacity=".4"/><rect x="3" y="3" width="14" height="9" rx="2" fill="currentColor"/><path d="M26 5v5" stroke="currentColor" stroke-width="2" opacity=".4"/></svg>
      </div>
    </div>
    <header class="contact-header">
      <a class="restart-button" href="/call" aria-label="Open simulated phone call">Call</a>
      <div class="contact"><span class="avatar" aria-hidden="true">R</span><h1>ReliefRN <span class="contact-chevron" aria-hidden="true">›</span></h1></div>
      <button class="restart-button" id="new-chat" type="button" aria-label="Restart demo" title="Restart with a fresh conversation"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 1.5 7M3 4v6h6"/></svg><span>Restart</span></button>
    </header>
    <section class="thread" id="thread" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
      <div class="thread-heading"><div class="channel-label">Text Message • SMS</div><div class="date-label" id="date-label">Today</div></div>
      <div id="messages"></div>
      <div class="typing-row" id="typing" hidden aria-label="ReliefRN is replying"><div class="typing"><i></i><i></i><i></i></div><span id="typing-label">ReliefRN is replying</span></div>
    </section>
    <footer class="composer-area">
      <div id="actions" class="actions" hidden></div>
      <div id="error" class="error" role="alert" hidden></div>
      <div class="composer-row">
      <button class="attachment-button" type="button" aria-label="Attachments unavailable" title="Attachments unavailable in this demo" disabled><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 5v18M5 14h18"/></svg></button>
      <form id="composer" class="composer">
        <label for="message" class="sr-only">Message ReliefRN</label>
        <textarea id="message" name="message" rows="1" maxlength="4000" placeholder="Text Message • SMS" autocomplete="off" enterkeyhint="send" required disabled></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      </div>
      <span class="home-indicator" aria-hidden="true"></span>
    </footer>
  </main>
  <p class="demo-note" id="demo-note">SMS demo · Signal is simulated. No real texts or callbacks.</p>
  </div>
</body>
</html>
